name: Bakcend Tests

on:
  
  push: 
    branches:
      - feature/posgresql
      - main
  pull_request:


jobs:
  test:
    runs-on: ubuntu-latest

    services:
      posrgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: posgres
          POSGRES_DB: support_tickets
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U posgres -d support_tickets"
          --health-interval=10s
          --health-retries=5

    defaults:
      run:
       working-directory: backend 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-pyhton@v5
        with:
          pyhton-version: "3.12"

      - name: Install dependecies
        run: |
          python -m pip install --upgrade pip 
          python -m pip install -r requeriments.txt

      - name : Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/support_tickets
          SECRET_KEY: test_secret_key
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 10080
        run: pytest

      
      